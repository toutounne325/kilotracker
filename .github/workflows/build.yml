name: Build Pirate Pips KiloTracker Pro APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Recuperation du depot GitHub
        uses: actions/checkout@v4

      - name: 2. Configuration de Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Installation du SDK Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 4. Creation du projet Android et injection des permissions natives
        run: |
          flutter create --platforms=android --org com.piratepips kilotracker_pro
          cp main.dart kilotracker_pro/lib/main.dart
          cd kilotracker_pro
          flutter pub add shared_preferences http
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"\/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"\/>\n    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION"\/>\n    <uses-permission android:name="android.permission.ACTIVITY_RECOGNITION"\/>\n    <uses-permission android:name="android.permission.BLUETOOTH"\/>\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN"\/>\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"\/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"\/>\n    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"\/>\n    <uses-permission android:name="android.permission.CAMERA"\/>\n    <application/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="Pirate Pips KiloTracker"/g' android/app/src/main/AndroidManifest.xml

      - name: 5. Compilation du fichier APK Release
        working-directory: kilotracker_pro
        run: flutter build apk --release

      - name: 6. Publication de l'APK dans les Artifacts GitHub
        uses: actions/upload-artifact@v4
        with:
          name: PiratePips-KiloTracker-Pro-APK
          path: kilotracker_pro/build/app/outputs/flutter-apk/app-release.apk
